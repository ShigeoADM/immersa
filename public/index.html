    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <!-- Tipografía de Immersa: Inconsolata (licencia libre, ver /fonts/OFL.txt), ajustada de ancho.
         Va en la propia web para que el texto ocupe exactamente lo mismo en todos los
         dispositivos: lo que el autor ajusta en la vista previa es lo que ve cada lector. -->
    <link rel="preload" href="/fonts/ImmersaMono-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ImmersaMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <style id="immersa-font">
      @font-face {
        font-family: "Immersa Mono"; font-weight: 400; font-style: normal; font-display: block;
        src: url("/fonts/ImmersaMono-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Immersa Mono"; font-weight: 700; font-style: normal; font-display: block;
        src: url("/fonts/ImmersaMono-Bold.woff2") format("woff2");
      }
      /* Toda la web usa esta tipografía, salvo lo que pide otra expresamente (el texto de
         las Webnovels, los iconos, el tutorial): eso lleva una clase r-fontFamily propia. */
      body,
      [class*="css-text"]:not([class*="r-fontFamily"]),
      input:not([class*="r-fontFamily"]),
      textarea:not([class*="r-fontFamily"]) {
        font-family: "Immersa Mono", Consolas, "Courier New", monospace;
      }
    </style>

    <!-- Las ilustraciones de las novelas son de sus autores: se quita lo que permite
         guardarlas directamente (menú de "guardar imagen" con el botón derecho o al mantener
         pulsado, y arrastrarlas fuera). No impide una captura de pantalla; eso no se puede. -->
    <!-- Android agranda el texto de las páginas según el "tamaño de letra" del sistema (y Chrome
         según su ajuste de accesibilidad). En las novelas Moderno eso descuadra el texto
         respecto a su cuadro, que el autor midió en el editor: aquí el tamaño lo decide la web. -->
    <style id="immersa-text-size">
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    </style>

    <style id="immersa-images">
      img {
        pointer-events: none;
        -webkit-touch-callout: none;
        -webkit-user-drag: none;
        user-select: none;
        -webkit-user-select: none;
      }
    </style>
    <script>
      (function () {
        // ¿El elemento (o alguno de los que lo contienen, hasta cierto nivel) es una imagen?
        function isImage(el) {
          for (var i = 0; el && el !== document.body && i < 5; i++, el = el.parentElement) {
            if (el.tagName === 'IMG' || el.tagName === 'PICTURE' || el.tagName === 'CANVAS') return true;
            var bg = window.getComputedStyle(el).backgroundImage;
            if (bg && bg.indexOf('url(') !== -1) return true;
            if (el.querySelector && el.querySelector(':scope > img')) return true;
          }
          return false;
        }
        document.addEventListener('contextmenu', function (e) {
          var tag = e.target && e.target.tagName;
          if (tag === 'INPUT' || tag === 'TEXTAREA') return; // en los campos de texto, el menú normal
          if (isImage(e.target)) e.preventDefault();
        }, true);
        document.addEventListener('dragstart', function (e) {
          if (isImage(e.target)) e.preventDefault();
        }, true);
      })();
    </script>

    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        /* Fondo de la app desde el primer instante: sin destello blanco al cargar */
        background-color: #0A0A0A;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      <h1>Immersa: novelas visuales, novelas ligeras y webnovels</h1>
      <p>
        Immersa es una plataforma gratuita para leer y escribir novelas y libros en español. Tiene dos
        formatos: Moderno, al estilo de una novela visual, con fondos, música, efectos de sonido y caminos
        distintos; y Webnovel, la lectura clásica por capítulos de las novelas ligeras y las novelas web.
      </p>
      <p>Necesitas activar JavaScript para usar Immersa.</p>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
